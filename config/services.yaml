# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # OnlyOffice монолита: адрес для браузера и секрет подписи (пусто — подпись выключена)
    onlyoffice_document_server_url: '%env(resolve:ONLYOFFICE_DOCUMENT_SERVER_URL)%'
    onlyoffice_jwt_secret: '%env(default::ONLYOFFICE_JWT_SECRET)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Не сервисы: сущности, сообщения шины и пользователь из JWT
        exclude:
            - '../src/Entity/'
            - '../src/Message/'
            - '../src/Security/JwtUser.php'
            - '../src/Kernel.php'

    # S3-клиент для MinIO монолита (файлы заявок)
    Aws\S3\S3Client:
        arguments:
            -   version: 'latest'
                region: '%env(MINIO_REGION)%'
                endpoint: '%env(MINIO_ENDPOINT)%'
                use_path_style_endpoint: true
                credentials:
                    key: '%env(MINIO_ACCESS_KEY)%'
                    secret: '%env(MINIO_SECRET_KEY)%'

    App\Service\Purchase\PurchaseFileStorageService:
        arguments:
            $s3: '@Aws\S3\S3Client'
            $bucket: '%env(MINIO_PURCHASE_BUCKET)%'

    App\Service\Purchase\PurchaseImageUrlGenerator:
        arguments:
            $imgproxyCacheBaseUrl: '%env(IMGPROXY_CACHE_BASE_URL)%'
            $minioPurchaseBucket: '%env(MINIO_PURCHASE_BUCKET)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *override* previous ones
