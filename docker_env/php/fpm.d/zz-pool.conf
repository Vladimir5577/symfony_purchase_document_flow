; ============================================================
; Кастомные настройки PHP-FPM пула.
; Применяются ПОСЛЕ www.conf из образа и переопределяют его.
; Префикс zz- гарантирует, что файл читается последним.
; ============================================================

[www]

; Закупки — один модуль, нагрузка в разы меньше монолита.
; ~120 МБ пиковой памяти на воркер => потолок ~1 ГБ.
pm = dynamic
pm.max_children      = 8
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Перезапуск воркера каждые 500 запросов — страховка от утечек памяти.
pm.max_requests      = 500
